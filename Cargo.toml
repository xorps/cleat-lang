[workspace]
resolver = "3"
members = ["crates/cleat-core", "crates/cleat", "crates/cleat-wasm"]
default-members = ["crates/cleat-core", "crates/cleat"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/xorps/cleat-lang"
publish = false

[profile.release]
strip = true

# The playground's WebAssembly: smaller download over peak speed.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
