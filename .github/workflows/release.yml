name: Release

# Push a tag like v0.1.0 to publish binaries, the VS Code extension, and the
# Argo CD sidecar image (ghcr.io/<owner>/cleat-cmp:<tag>).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --bin cleat --target ${{ matrix.target }}
      - run: tar -czf cleat-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release cleat
      - uses: actions/upload-artifact@v4
        with:
          name: cleat-${{ matrix.target }}
          path: cleat-*.tar.gz

  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: editors/vscode/package.sh && mv editors/vscode/cleat.vsix cleat-${{ github.ref_name }}.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: cleat-vsix
          path: cleat-*.vsix

  argocd-sidecar-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/argocd/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cleat-cmp:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/cleat-cmp:latest

  publish:
    needs: [binaries, vscode-extension, argocd-sidecar-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
