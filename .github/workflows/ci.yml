name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Fetch the Kubernetes schema (used by schema tests and examples)
        run: schemas/fetch.sh 1.37
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Check that cleat-core builds without std (a target with no std at all)
        run: |
          rustup target add thumbv7em-none-eabihf
          cargo clippy -p cleat-core --locked --target thumbv7em-none-eabihf -- -D warnings
      - name: Lint the playground's WebAssembly crate
        run: |
          rustup target add wasm32-unknown-unknown
          cargo clippy -p cleat-wasm --locked --target wasm32-unknown-unknown -- -D warnings
      - name: Check the page scripts (playground, cleat view)
        run: |
          node --check site/playground/playground.js
          node --check crates/cleat/src/view/view.js
      - name: Check examples
        run: |
          cargo run -q -- check examples/quickstart.cleat
          cargo run -q -- check examples/webapp.cleat
          cargo run -q -- check examples/overlays/prod.cleat
          cargo run -q -- export examples/overlays/prod.cleat --set image=ghcr.io/acme/api:1 --target argocd > /dev/null

  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node --check editors/vscode/extension.js
      - run: editors/vscode/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cleat-vsix
          path: editors/vscode/cleat.vsix

  argocd-sidecar-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f deploy/argocd/Dockerfile -t cleat-cmp:ci .
      - name: Smoke test (distroless, so inspect from outside; no shell inside)
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' cleat-cmp:ci)" = 999
          docker run --rm cleat-cmp:ci cleat 2>&1 | grep -q "cleat argocd generate"
          c=$(docker create cleat-cmp:ci cleat)
          docker cp "$c:/home/argocd/cmp-server/config/plugin.yaml" plugin.yaml
          docker cp "$c:/usr/local/bin/cleat" cleat-bin
          docker rm "$c"
          cmp plugin.yaml deploy/argocd/plugin.yaml
          file cleat-bin | grep -q "static"

